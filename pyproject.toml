[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "network-lens"
version = "0.1.0"
description = "A local, process-centered Windows TCP snapshot viewer"
requires-python = ">=3.12"
dependencies = ["psutil==7.2.2", "nicegui==4.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.14,<1"]

[project.scripts]
network-lens = "network_lens.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
